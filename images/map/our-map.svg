<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2E2622" opacity="0.035" />
    </pattern>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="800" height="600" fill="#FAF3E7" />
  <rect x="0" y="0" width="800" height="600" fill="url(#dots)" />
  <rect x="10" y="10" width="780" height="580" fill="none" stroke="#2E2622" stroke-opacity="0.15" stroke-width="2" rx="18" />

  <!-- the Nile, stylized -->
  <path d="M 430 0 C 390 90, 460 160, 420 260 C 380 360, 450 420, 410 520 C 390 560, 400 580, 405 600"
        fill="none" stroke="#8FAAB0" stroke-opacity="0.55" stroke-width="26" stroke-linecap="round" />
  <path d="M 430 0 C 390 90, 460 160, 420 260 C 380 360, 450 420, 410 520 C 390 560, 400 580, 405 600"
        fill="none" stroke="#A8C0C4" stroke-opacity="0.4" stroke-width="10" stroke-linecap="round" />

  <!-- soft shaded zones marking each neighborhood, no icons -->
  <ellipse cx="168" cy="222" rx="170" ry="155" fill="#C97064" opacity="0.05" />
  <ellipse cx="560" cy="408" rx="150" ry="115" fill="#8A9A7E" opacity="0.06" />
  <ellipse cx="640" cy="132" rx="115" ry="90" fill="#8FAAB0" opacity="0.07" />

  <!-- dotted journey path -->
  <path d="M 200 260 Q 380 320 540 440 Q 610 300 630 150"
        fill="none" stroke="#C97064" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round" opacity="0.7" />

  <!-- district labels, positioned clear above where each pin cluster will sit -->
  <text x="168" y="60" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#2E2622" text-anchor="middle">Tahrir</text>
  <text x="560" y="342" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#2E2622" text-anchor="middle">Maadi</text>
  <text x="640" y="48" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#2E2622" text-anchor="middle">Zamalek</text>

  <!-- compass -->
  <g transform="translate(730,540)" opacity="0.5">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#2E2622" stroke-width="1.2" />
    <path d="M0 -18 L4.5 0 L0 18 L-4.5 0 Z" fill="#C97064" />
    <text x="0" y="-29" font-family="Inter, sans-serif" font-size="10" fill="#2E2622" text-anchor="middle">N</text>
  </g>

  <!-- title -->
  <text x="400" y="595" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#2E2622" opacity="0.5" text-anchor="middle">our little corner of Cairo</text>

  <!-- heart accent -->
  <g transform="translate(390,330)" opacity="0.5">
    <path d="M0 6 C -6 -4, -16 2, 0 16 C 16 2, 6 -4, 0 6 Z" fill="#C97064" />
  </g>
</svg>
